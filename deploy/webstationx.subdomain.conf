## WebStationX behind SWAG: https://play.<your-duckdns-domain>
## The app needs HTTPS (gamepads, WebRTC) and WebSocket upgrades on /ws.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name play.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 64M;

    # Signaling WebSocket for online play.
    location /ws {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app webstationx;
        set $upstream_port 8090;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app webstationx;
        set $upstream_port 8090;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        # Disc images are large; stream them straight through.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
